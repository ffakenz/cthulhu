[package]
name = "backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cthulhu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
    "std", "help", "usage", "error-context", "derive",
] }
csv = "1.4"
engine = { path = "../libs/engine" }
serde = { version = "1", features = ["derive"] }
store = { path = "../libs/store" }
thiserror = "2.0.21"

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints]
workspace = true
