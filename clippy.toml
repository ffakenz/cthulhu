allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "time arrives as a `now` parameter or through a Clock port" },
  { path = "std::time::Instant::now", reason = "time arrives as a `now` parameter or through a Clock port" },
  { path = "std::time::SystemTime::elapsed", reason = "it reads the clock; subtract a `now` parameter instead" },
  { path = "std::time::Instant::elapsed", reason = "it reads the clock; subtract a `now` parameter instead" },
  { path = "std::env::var", reason = "configuration is parsed once in main from an environment snapshot" },
  { path = "std::env::var_os", reason = "configuration is parsed once in main from an environment snapshot" },
  { path = "std::env::vars", reason = "configuration is parsed once in main from an environment snapshot" },
  { path = "std::env::vars_os", reason = "configuration is parsed once in main from an environment snapshot" },
  { path = "std::env::args", reason = "arguments are parsed once in main" },
  { path = "std::env::args_os", reason = "arguments are parsed once in main" },
  { path = "std::env::current_dir", reason = "process state is read once in main and passed down" },
  { path = "std::env::temp_dir", reason = "process state is read once in main and passed down" },
  { path = "std::process::exit", reason = "it skips every pending Drop; main returns an ExitCode" },
  { path = "std::thread::spawn", reason = "std::thread::scope gives every thread a known end and a waiter" },
  { path = "std::thread::Builder::spawn", reason = "std::thread::scope gives every thread a known end and a waiter" },
  { path = "std::thread::sleep", reason = "a decision returns the delay; the interpreter waits" },
  { path = "std::panic::catch_unwind", reason = "a panic is a bug; failures are values" },
  { path = "clap::Parser::parse", reason = "it reads the process's arguments, and exits on a usage error, the help or the version; main parses its snapshot with try_parse_from" },
  { path = "clap::Parser::try_parse", reason = "it reads the process's arguments; main parses its snapshot with try_parse_from" },
  { path = "clap::Parser::parse_from", reason = "it exits on a usage error, the help or the version, skipping every pending Drop; main maps every clap::Error to an exit status" },
  { path = "clap::Parser::update_from", reason = "it exits on a usage error, the help or the version, skipping every pending Drop; main maps every clap::Error to an exit status" },
  { path = "clap::Command::get_matches", reason = "it reads the process's arguments, and exits on a usage error, the help or the version; main parses its snapshot with try_parse_from" },
  { path = "clap::Command::get_matches_mut", reason = "it reads the process's arguments, and exits on a usage error, the help or the version; main parses its snapshot with try_parse_from" },
  { path = "clap::Command::try_get_matches", reason = "it reads the process's arguments; main parses its snapshot with try_parse_from" },
  { path = "clap::Command::get_matches_from", reason = "it exits on a usage error, the help or the version, skipping every pending Drop; main maps every clap::Error to an exit status" },
  { path = "clap::Command::print_help", reason = "it writes to the process's stdout itself; main writes through the handle it locked" },
  { path = "clap::Command::print_long_help", reason = "it writes to the process's stdout itself; main writes through the handle it locked" },
  { path = "clap::error::Error::exit", reason = "it exits the process, skipping every pending Drop; main returns an ExitCode" },
  { path = "clap::error::Error::print", reason = "it writes to the process's streams itself; main writes through the handles it locked" },
]
